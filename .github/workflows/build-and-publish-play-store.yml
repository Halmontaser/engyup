name: Build & Publish Engy Up to Google Play

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-and-publish-play-store.yml'

jobs:
  build-and-publish:
    name: Build AAB & Publish to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: 6. Make Gradlew Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: 7. Build Android App Bundle (AAB)
        run: |
          cd mobile/android
          ./gradlew bundleRelease --stacktrace

      - name: 8. Locate & Copy Release AAB
        run: |
          mkdir -p mobile/artifacts
          find mobile/android/app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} mobile/EngyUp-release.aab \;
          find mobile/android/app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} mobile/artifacts/EngyUp-v1.0.0.aab \;
          ls -lh mobile/EngyUp-release.aab

      - name: 9. Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EngyUp-v1.0.0-Release-AAB
          path: mobile/artifacts/EngyUp-v1.0.0.aab
          retention-days: 30

      - name: 10. Publish to Google Play Console
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd mobile
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "$PLAY_SERVICE_ACCOUNT_JSON" > google-service-account.json
          fi
          if [ -f "google-service-account.json" ]; then
            node scripts/publish-and-setup.mjs
          else
            echo "::notice::Service account key not found in repository or secrets. AAB bundle built and uploaded as artifact for manual or local upload."
          fi
